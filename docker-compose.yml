services:
  postgres:
    image: postgres:16-alpine
    container_name: seatlock-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-seatlock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seatlock}
      POSTGRES_DB: ${POSTGRES_DB:-seatlock}
    ports:
      - "5433:5432"
    volumes:
      - seatlock_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-seatlock} -d ${POSTGRES_DB:-seatlock}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  seatlock_pgdata:
